[project]
name = "rag-study"
version = "0.1.0"
description = "从零手写的 RAG 知识库问答系统（不依赖 LangChain）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "numpy>=1.26",
    "httpx2>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 中文注释里常有较长的说明，不强行折行
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

asyncio_default_fixture_loop_scope = "function"
